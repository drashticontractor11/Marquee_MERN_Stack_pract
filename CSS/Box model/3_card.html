<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        /* body {
            animation: bg 5s linear 1s infinite;
        } */

        @keyframes bg {
            0% {
                background-color: white;
            }

            30% {
                background-color: red;
            }

            60% {
                background-color: green;
            }

            100% {
                background-color: blue;
            }
        }

        card {
            display: block;
            background-color: white;
            width: 300px;
            height: 400px;
            border: 1px solid #333;
            border-radius: 10px;
            margin: 0 auto;
            position: relative;
            overflow: visible;
            animation: moveup 2s linear 1s 1;
        }

        @keyframes moveup {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }

        }

        /* #sec1 {
            width: 50%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

        } */


        #div1 {
            width: 100%;
            height: 30%;
            background-color: #333;
            border-top-left-radius: 10px;
            border-top-right-radius: 10px;
            position: relative;
            transition: background-color 2s ease-in-out 0.2s;

            transition: transform 2s ease-out 1s;
        }

        /* transition */
        #div1:hover {
            background-color: red;
        }

        h2 {
            transform: scale(1);
        }

        /* h2:hover {
            background-color: green;
            transform: scale(1.3);
        } */

        /* #img_container:hover img {
            transform: scale(1.5);
            
        } */

        #img {
            width: 100%;
            height: 100%;
            /* transform: scale(1); */
        }



        #div1 {
            width: 100%;
            height: 30%;
            background-color: #333;
            border-top-left-radius: 10px;
            border-top-right-radius: 10px;
            position: relative;
        }

        #img_container {
            width: 100%;
         
            position: absolute;
            bottom: -30px;
        }

        #img_container img {
            display: block;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 4px solid rgb(16, 15, 15);
            margin: 0 auto;
        }

        .div2 {
            text-align: center;
            padding-top: 30px;
            transition: transform 3s ease-out 3s;
            transition-delay: 5s;
        }

        #icon i {
            text-align: center;
            margin: 0 auto;

        }

        .button:hover {
            background-color: #636262;
        }

        .button {
            background-color: #333;
            transition: background-color;
            color: #fff;
            border-radius: 30px;
            padding: 10px 20px;
            cursor: pointer;
            margin: 0 auto;
        }

        .stats {
            position: absolute;
            width: 100%;
            text-align: center;
            display: flex;
            justify-content: space-evenly;
            align-items: center;
        }
       

        #status {
             width:20px;
            height: 20px;
            background-color: rgb(26, 229, 63);
            border-radius: 50%;
            display: flex;
            justify-content: end;
            align-items: center;
            position: relative;
            top:100px;
            left: 60%;
            animation: blinking 1s infinite 1s ease-in-out;
        }
       @keyframes blinking {
        0%{
            background-color: rgb(21, 167, 47);
        }
        50%{
             background-color: rgb(52, 187, 77);
        }
        100%{
             background-color: rgb(92, 225, 116);
        }
        
       }
      
       #fb:hover, #twitter:hover,#linkedin:hover{
        color: blue;
       }
       #fb, #twitter, #linkedin, #insta{
        transition: color;
       }
       #insta:hover{
        color: palevioletred;
       }
    </style>
</head>

<body>
    <section id="sec1">
        <card>
            <div id="div1">
                <div id="img_container">
                    <div id="status"></div>
                    <img src="images/image.png" alt="Image">
                </div>
            </div>
            <div>
                <div class="div2">
                    <h2>Drashti Contractor</h2>
                    <p>3rd year Btech CSE student at Parul University</p>
                    <i class="fa-brands fa-facebook" id="fb"></i>
                    <i class="fa-brands fa-twitter" id="twitter"></i>
                    <i class="fa-brands fa-instagram" id="insta"></i>
                    <i class="fa-brands fa-linkedin" id="linkedin"></i><br><br>
                    <button class="button">Subscribe</button>
                    <button class="button">Message</button><br><br>
                </div>
                <div class="stats">
                   <div class="icon"> <i class="fa-regular fa-heart"></i> 80.4K |</div>
                    <div class="icon"><i class="fa-regular fa-comment"></i>20.4K |</div>
                   <div class="icon"> <i class="fa-solid fa-share"></i> 12.4K</div>
                </div>
            </div>
        </card>
    </section>

</body>

</html>
