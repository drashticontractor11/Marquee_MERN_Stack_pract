<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table {
            border-collapse: collapse;
        }

        th,
        td {
            border: 1px solid #000;
            padding: 8px;
        }

        .a {
            text-align: center;
        }

        .b {
            text-align: right;
        }
    </style>
</head>

<body>
    <table>
        <thead>
            <colgroup>
                <col span="1" class="">
                <col span="2" class="a">
            </colgroup>
            <tr>
                <th colspan="2"><b>Invoice #1234567890</b></th>
                <th colspan="2"><b>14 January 2025</b></th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td colspan="2">
                    <p><b>Pay To:</b><br>
                        Acme Billing Co.<br>
                        123 Main St.<br>
                        Cityville, ST 12345</p>
                </td>
                <td colspan="2">
                    <p><b>Customer:</b><br>
                        Jane Smith<br>
                        321 Willow Way<br>
                        Southwast Northwestrnshie, MA 54321</p>
                </td>
            </tr>
            <tr>
                <td><b>Name/Description</b></td>
                <td class="a"><b>Qty.</b></td>
                <td class="a"><b>@</b></td>
                <td class="a"><b>Cost</b></td>
            </tr>
            <tr>
                <td>Paperclips</td>
                <td class="a">1000</td>
                <td class="a">0.01</td>
                <td class="a">10.00</td>
            </tr>
            <tr>
                <td>Staples</td>
                <td class="a">1000</td>
                <td class="a">1.00</td>
                <td class="a">100.00</td>
            </tr>
            <tr>
                <td class="b" colspan="3"><b>Subtotal</b></td>
                <td>110.00</td>
            </tr>
            <tr>
                <td class="b" colspan="2"><b>Tax</b></td>
                <td class="a">8%</td>
                <td>8.80</td>
            </tr>
            <tr>
                <td class="b" colspan="3"><b>Grand Total</b></td>
                <td><b>$118.80</b></td>
            </tr>
        </tbody>
    </table>
</body>

</html>
