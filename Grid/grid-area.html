<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: gilroy, sans-serif;
        }

        html,
        body {
            height: 100vh;
            width: 100vw;
            /* padding: 10px; */
        }

        #container {
            width: 70vw;
            height: 90%;
            display: grid;
            grid-template-columns: 200px 1fr 1fr;
            grid-template-rows: 60px 1fr 1fr 60px;
            grid-template-areas:
                'header header header'
                'sidebar c-1 c-1'
                'sidebar c-2 c-3'
                'foot foot foot';
            grid-gap: 10px;
            margin: 10px;

        }

        #header {
            grid-area: header;
            background-color: yellow;
            text-align: center;
            
        }

        #sidebar {
            grid-area: sidebar;
            background-color: orange;
            text-align: center;


        }

        #c-1 {
            grid-area: c-1;
            background-color: red;
            text-align: center;

        }

        #c-2 {
            grid-area: c-2;
            background-color: purple;
            text-align: center;

        }

        #c-3 {
            grid-area: c-3;
            background-color: blueviolet;
            text-align: center;

        }

        #footer {
            grid-area: foot;
            background-color: yellow;
            text-align: center;

        }
    </style>
</head>

<body>
    <div id="container">
        <div id="header">Header</div>
        <div id="sidebar">Sidebar</div>
        <div id="c-1">Content-1</div>
        <div id="c-2">Content-2</div>
        <div id="c-3">Content-3</div>
        <div id="footer">Footer</div>
    </div>
</body>

</html>
